<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 25</title>
    <script defer>
        function focarEpintar(){
            var input = document.querySelector('#texto')
            input.style.backgroundColor = 'pink'
 
        }
        function perderFoco(){
            var input = document.querySelector('#texto')
            input.style.backgroundColor = 'white'
        }
    </script>
</head>
<body>
    <input type="text" id = "texto" name="texto" onfocus="focarEpintar()" onblur="perderFoco()">
</body>
</html>
