<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 24</title>
    <script defer>
        function Vermelho(){
            var div = document.querySelector('div')
            div.style.backgroundColor = 'red'
           
        }
           function Amarelo(){
            var div = document.querySelector('div')
            div.style.backgroundColor = 'yellow'
           
        }
           function Verde(){
            var div = document.querySelector('div')
            div.style.backgroundColor = 'green'
           
        }
      
    </script>
</head>
<body>
    <div style="width: 100px; height: 100px; background-color: black; border-radius: 100%;"></div>

    <button onclick="Vermelho()">Clique Aqui</button>
    <button onclick="Amarelo()">Clique Aqui</button>
    <button onclick="Verde()">Clique Aqui</button>



</body>
</html>
