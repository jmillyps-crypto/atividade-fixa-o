<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 12</title>
    <script defer>
        function alterarTamanho(){
            var p = document.querySelector('p')
            p.style.fontSize = '30px'
        }
    </script>
</head>
<body>
    <p>Um texto legal aqui</p>
    <button onclick="alterarTamanho()">Clique Aqui</button>
</body>
</html>
