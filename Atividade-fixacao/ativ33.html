<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 33</title>
    <script defer>
        function removerdaLista(){
            var lista = document.querySelector('ul')
            var ultimo = document.querySelectorAll('li')

            ultimo[ultimo.length - 1].remove()
         
        }
    </script>
</head>
<body>
     <ul>
        <li id="primeiro">Pera</li>
        <li>Goiaba</li>
        <li>Melancia</li>
    </ul>

    <button onclick="removerdaLista()">Clque aqui</button>
</body>
</html>
