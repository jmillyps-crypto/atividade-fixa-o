<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 31</title>
    <script defer>
        function adicionarLinha(){
            var p = document.querySelector('p')
            p.innerHTML += '<br>Nova linha'
         
        }
    </script>
</head>
<body>
    <p>Primeira linha</p>
    <button onclick="adicionarLinha()">Clque aqui</button>
</body>
</html>
