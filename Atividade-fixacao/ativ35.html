<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 35</title>
    <script defer>
        var cliques = 0
        function contarCliques(){
            cliques += 1
            var p = document.querySelector('p')
            p.innerHTML = cliques
         
        }
    </script>
</head>
<body>
    <p>0</p>
    <button onclick="contarCliques()">Clque aqui</button>
</body>
</html>
