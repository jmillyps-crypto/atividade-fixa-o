<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 17</title>

    <script defer>
        function ocultarP(){
            var p = document.querySelector('p')
            
            if(p.style.display == 'none'){
                p.style.display = 'block'

            }
            else{
                p.style.display == 'none'
            }
           
            
        }
    </script>
</head>
<body>
    <p style="display :none">Um texto legal aqui</p>
    <button onclick="ocultarP()">Clique Aqui</button>
</body>
</html>
