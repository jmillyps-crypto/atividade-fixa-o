<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 50</title>
    <script>
        function gerarNumero(){
            var numero = Math.floor(Math.random() * 100) + 1;
            var p = document.querySelector ('p')
            p.innerHTML = numero
        }

    </script>
</head>
<body>
    <p></p>
    <button onclick="gerarNumero()">Clque aqui</button>
</body>
</html>
