<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 9</title>
    <script defer>
        function alterarLista(){
            var primeiro = document.querySelector('#primeiro')
            primeiro.innerHTML = 'Melao'
        }
    </script>
</head>
<body>
    
    <ul>
        <li id="primeiro">Pera</li>
        <li>Goiaba</li>
        <li>Melancia</li>
    </ul>

    <button onclick="alterarLista()">Clique Aqui</button>
</body>
</html>
