<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 43</title>

    <script defer>
        function mostrarEocultarP(){
            var p = document.querySelector('p')
            
            if(p.style.display == 'none'){
                p.style.display = 'block'

            }
            else{
                p.style.display = 'none'
            }
           
            
        }
    </script>
</head>
<body>
    <p>Um texto legal aqui</p>
    <button onclick="mostrarEocultarP()">Clique Aqui</button>
</body>
</html>
