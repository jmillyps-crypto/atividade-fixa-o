<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 20</title>
    <script defer>
        function modoClaro(){
            var body = document.querySelector('body')
            body.style.backgroundColor = 'white'
        }
        function modoEscuro(){
            var body = document.querySelector('body')
            body.style.backgroundColor = 'black'
        }
    </script>
</head>
<body>
    <button onclick="modoClaro()">Mude para o branco</button>
    <button onclick="modoEscuro()">Mude para o preto</button>
</body>
</html>
