<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 46</title>
    <script defer>
        function caixadeTexto(){
            var nome = document.querySelector("#texto").value
            var p = document.querySelector("p")


            p.innerHTML = texto.value

         
        }
    </script>
</head>
<body>
    
    <input type="text" id = "texto" name="nome">
    <p></p>
    <button onclick="caixadeTexto()">Clique Aqui</button>
    
</body>
</html>
