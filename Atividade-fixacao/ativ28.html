<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 28</title>
    <script defer>
        var clique = 0
        function desabilitarBotao(){
            var botao = document.querySelector('button')
           if(clique = 1){
                botao.disabled = true
           }
         
        }
    </script>
</head>
<body>
    
    <button onclick="desabilitarBotao()">Clque aqui</button>
</body>
</html>
