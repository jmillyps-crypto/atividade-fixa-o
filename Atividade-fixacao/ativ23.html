<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 23</title>
    <script defer>
        function mudarCordiv(){
            var div = document.querySelector('div')
            div.style.backgroundColor = 'pink'
         
        }
    </script>
</head>
<body>
    <div style="width: 100px; height: 100px; background-color: yellow;" onmouseover="mudarCordiv()"></div>
</body>
