<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 7</title>
    <script defer>
        function pegarCaracter(){
            var p = document.querySelector("p").innerText.length
            var div = document.querySelector('div')

          
            var novo = document.createElement('h4')
            novo.innerHTML = p

           div.appendChild(novo)

           
        }
    </script>
</head>
<body>
    
    <p>Um texto legal aqui</p>
    <div></div>
    <button onclick="pegarCaracter()">Clique Aqui</button>
</body>
</html>
