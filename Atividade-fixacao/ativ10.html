<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 10</title>
    <script defer>
        function pegarID(){
            var p = document.querySelector("#paragrafo").id
            var div = document.querySelector('div')

          
            var novo = document.createElement('h4') 
            novo.innerHTML = p

           div.appendChild(novo)

           
        }
    </script>
</head>
<body>
    
    <p id="paragrafo">Um texto legal aqui</p>
    <div></div>
    <button onclick="pegarID()">Clique Aqui</button>
</body>
</html>
