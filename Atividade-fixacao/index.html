<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1</title>
    <script defer>
         function exibeTexto(){
            var div = document.querySelector('div')

            var novo = document.createElement('h3')
            novo.innerHTML = 'Texto exibido'

            
            console.log(div.appendChild(novo))
         }
    </script>
</head>
<body>

    <div></div>
    <button onclick="exibeTexto()">Clique Aqui</button>
</body>
</html>
