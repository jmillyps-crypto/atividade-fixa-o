<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 34</title>
    <script defer>
        function alterarTexto(){
            var p = document.querySelector('p')
            p.innerHTML = 'Texto resetado'
         
        }
    </script>
</head>
<body>
    <p>Um texto legal aqui</p>
    <button onclick="alterarTexto()">Clque aqui</button>
</body>
</html>
